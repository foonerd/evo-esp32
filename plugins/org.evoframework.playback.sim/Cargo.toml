[package]
name = "org-evoframework-playback-sim"
description = "Playback warden for evo-esp32 that plays a track against the fabric's clock without decoding it: the custody, the position, the corrections, so the fabric can be driven before a decoder exists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# A reference warden — Apache 2.0 so plugin authors can copy the custody
# pattern into a real decoder without restriction.
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
evo-esp32-sdk = { path = "../../sdk" }

[dev-dependencies]
evo-esp32-steward = { path = "../../steward" }
serde_json = { workspace = true }
