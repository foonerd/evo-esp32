[package]
name = "org-evoframework-playback-symphonia"
description = "Playback warden for evo-esp32 that decodes a track with Symphonia and drives the frames into the distribution's sink: FLAC, MP3, WAV and PCM, position from frames delivered, pause, resume and seek."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# A reference warden — Apache 2.0 so a device's decoder can copy it.
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
evo-esp32-sdk = { path = "../../sdk", features = ["std"] }
# Pure Rust, MPL-2.0 (file-level copyleft; linking is unaffected). No SIMD
# feature: that pulls rustfft, and the target has no SIMD. Codecs are the
# ones a card of music holds.
symphonia = { version = "0.6", default-features = false, features = ["id3v1", "id3v2", "wav", "ogg"] }
log = "0.4"

[features]
default = ["flac", "mp3", "pcm", "vorbis", "aac", "aac-symphonia"]
flac = ["symphonia/flac"]
mp3 = ["symphonia/mp3"]
pcm = ["symphonia/pcm"]
vorbis = ["symphonia/vorbis"]
# The ADTS demuxer and AAC's place in the stream logic; the decoder is
# `aac-symphonia`, or one the distribution registers (Espressif's on
# the board: Symphonia's is built on the stack before it is boxed, tens
# of kilobytes of it, and decodes the AAC-LC core alone).
aac = ["symphonia/aac"]
aac-symphonia = ["aac"]

[dev-dependencies]
evo-esp32-steward = { path = "../../steward" }
serde_json = { workspace = true }
