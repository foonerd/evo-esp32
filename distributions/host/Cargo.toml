[package]
name = "evo-esp32-host"
description = "The host distribution of evo-esp32: the audio catalogue compiled in, the steward with the files source, the simulated playback warden and the null sink, driven from a directory of music on a desktop; what a firmware distribution does, without a board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The companion's pages, by commit until its first tag (MIT; the
# dependency runs this way only, never the reverse).
companion-core = { git = "https://github.com/foonerd/volumio-esp-companion", rev = "581a51121470ee266968502e7240f8af326a1987" }
embedded-graphics = "0.8"
embedded-graphics-simulator = { version = "0.8", default-features = false }
evo-esp32-catalogue = { path = "../../catalogue" }
evo-esp32-sdk = { path = "../../sdk" }
evo-esp32-steward = { path = "../../steward" }
org-evoframework-delivery-null = { path = "../../plugins/org.evoframework.delivery.null" }
org-evoframework-playback-sim = { path = "../../plugins/org.evoframework.playback.sim" }
org-evoframework-source-files = { path = "../../plugins/org.evoframework.source.files" }
serde_json = { workspace = true, features = ["std"] }

[build-dependencies]
evo-esp32-catalogue = { path = "../../catalogue" }
