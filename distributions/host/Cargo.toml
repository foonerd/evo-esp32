[package]
name = "evo-esp32-host"
description = "The host distribution of evo-esp32: the audio catalogue compiled in, the steward with the files source, the Symphonia playback warden decoding into a paced sink and the null output, driven from a directory of music on a desktop; what a firmware distribution does, without a board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
embedded-graphics = "0.8"
embedded-graphics-simulator = { version = "0.8", default-features = false }
evo-esp32-catalogue = { path = "../../catalogue" }
evo-esp32-panel = { path = "../panel" }
evo-esp32-sdk = { path = "../../sdk" }
evo-esp32-steward = { path = "../../steward" }
org-evoframework-delivery-null = { path = "../../plugins/org.evoframework.delivery.null" }
org-evoframework-playback-symphonia = { path = "../../plugins/org.evoframework.playback.symphonia" }
org-evoframework-source-files = { path = "../../plugins/org.evoframework.source.files" }
serde_json = { workspace = true, features = ["std"] }

[build-dependencies]
evo-esp32-catalogue = { path = "../../catalogue" }
