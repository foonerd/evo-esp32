[package]
name = "evo-esp32-board-waveshare-esp32-c5-touch-lcd-28"
description = "evo-esp32: the Waveshare ESP32-C5-Touch-LCD-2.8 brought up in the vendor BSP's order: the expander, the ST7789 panel over SPI, the CST3530 touch controller, the backlight, the shared buses"
version = "0.2.6"
edition = "2021"
# Written for the Volumio ESP companion (MIT) and carried here as it was;
# see NOTICE.
license = "MIT"
repository = "https://github.com/foonerd/evo-esp32"
publish = false

# Built only inside a firmware crate's workspace: esp-idf-svc compiles for
# ESP-IDF targets alone.

# Built only inside a firmware crate's workspace: esp-idf-svc compiles for
# ESP-IDF targets alone, so the host workspace excludes this crate and the
# firmware's build carries it.

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
type_complexity = "allow"

[dependencies]
ch32v003-expander = { path = "../../drivers/ch32v003-expander" }
cst3530 = { path = "../../drivers/cst3530" }
embedded-hal-bus = { version = "0.3", features = ["std"] }
esp-idf-svc = { version = "0.53", default-features = false, features = ["std", "alloc"] }
log = "0.4"
mipidsi = "0.10"
