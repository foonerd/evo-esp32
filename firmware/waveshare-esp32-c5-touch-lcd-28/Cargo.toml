[package]
name = "evo-esp32-waveshare-esp32-c5-touch-lcd-28"
version = "0.2.4"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/foonerd/evo-esp32"
publish = false
description = "evo-esp32 on the Waveshare ESP32-C5-Touch-LCD-2.8: the player's firmware for its first board"

[[bin]]
name = "evo-esp32-waveshare-esp32-c5-touch-lcd-28"
path = "src/main.rs"
harness = false

# A workspace of its own: ESP-IDF target, nightly channel, own sdkconfig.
[workspace]

[dependencies]
# The board and its drivers, this repository's own (boards/, drivers/).
board = { package = "evo-esp32-board-waveshare-esp32-c5-touch-lcd-28", path = "../../boards/waveshare-esp32-c5-touch-lcd-28" }
cst3530 = { path = "../../drivers/cst3530" }
es8311 = { path = "../../drivers/es8311" }
es9018k2m = { path = "../../drivers/es9018k2m" }
pcm512x = { path = "../../drivers/pcm512x" }
wm8960 = { path = "../../drivers/wm8960" }
embedded-hal-bus = { version = "0.3", features = ["std"] }
esp-idf-svc = { version = "0.53", features = ["std", "binstart"] }
log = "0.4"
anyhow = "1"
# The fabric, by path: this crate is a workspace of its own for the ESP
# target, but the code it runs is this repository's.
evo-esp32-config = { path = "../../distributions/config" }
evo-esp32-face = { path = "../../distributions/face" }
evo-esp32-update = { path = "../../distributions/update" }
evo-esp32-platform-esp-idf = { path = "../../platform/esp-idf" }
evo-esp32-queue = { path = "../../distributions/queue" }
evo-esp32-sdk = { path = "../../sdk", features = ["std"] }
evo-esp32-steward = { path = "../../steward" }
evo-esp32-catalogue = { path = "../../catalogue" }
evo-esp32-volumio = { path = "../../distributions/volumio" }
org-evoframework-source-files = { path = "../../plugins/org.evoframework.source.files" }
org-evoframework-source-dlna = { path = "../../plugins/org.evoframework.source.dlna" }
org-evoframework-source-smb = { path = "../../plugins/org.evoframework.source.smb" }
org-evoframework-source-nfs = { path = "../../plugins/org.evoframework.source.nfs" }
# AAC's demuxer, not Symphonia's AAC decoder (it overflows the main
# task's stack); Espressif's decodes, registered by the platform crate.
org-evoframework-playback-symphonia = { path = "../../plugins/org.evoframework.playback.symphonia", default-features = false, features = ["flac", "mp3", "pcm", "vorbis", "aac"] }
org-evoframework-delivery-null = { path = "../../plugins/org.evoframework.delivery.null" }
org-evoframework-multiroom-receiver = { path = "../../plugins/org.evoframework.multiroom.receiver" }
org-evoframework-snapcast-receiver = { path = "../../plugins/org.evoframework.snapcast.receiver" }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[features]
# A firmware that never confirms itself after an update and is rolled
# back by the bootloader half a minute in: the bench's proof that the
# return path works. Never released.
gate-test = []
# A firmware whose page is locked as `bench`/`bench` when the card
# names no web_user: the bench's proof of the lock. Never released.
lock-test = []

[build-dependencies]
embuild = "0.33.5"
evo-esp32-catalogue = { path = "../../catalogue" }

[profile.release]
# The decoder runs here; speed over size, with 3 MB of app partition.
opt-level = 3
debug = false

[profile.dev]
opt-level = "z"
debug = true
