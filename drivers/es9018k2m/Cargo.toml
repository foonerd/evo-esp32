[package]
name = "es9018k2m"
description = "evo-esp32: driver for the ESS ES9018K2M DAC as Raspberry Pi HATs carry it (LightSABRE, I-Sabre K2M class): detection, the init sequence, volume and mute over I2C, over embedded-hal"
version.workspace = true
edition.workspace = true
# Written for the Volumio ESP companion (MIT) and carried here as it was;
# see NOTICE.
license = "MIT"
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
embedded-hal = "1"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }
